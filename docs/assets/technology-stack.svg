<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 665" width="1280" height="665" role="img" aria-labelledby="title desc"><title id="title">Technology stack and actual execution status</title><desc id="desc">Python FastAPI runtime with vanilla JavaScript frontend, separate scikit-learn research training, testing and GitHub Actions. Next.js and React exist in an optional separate frontend.</desc><rect width="1280" height="665" fill="#f2f6f6"/><rect width="1280" height="8" fill="#276e78"/><g font-family="Inter,Arial,sans-serif"><text x="50" y="63" font-size="32" font-weight="760" fill="#153045">Built with a deliberately small runtime stack</text><text x="51" y="95" font-size="16" fill="#526f7e">The working browser demo is served from FastAPI. Research training and alternate frontend are separate.</text><rect x="48" y="158" width="284" height="350" rx="18" fill="#fff" stroke="#cadae0"/><rect x="48" y="158" width="284" height="8" rx="4" fill="#4f9f87"/><circle cx="84" cy="205" r="21" fill="#20394a"/><text x="84" y="210" font-size="14" fill="#e1f7f1" font-weight="800" text-anchor="middle">01</text><text x="68" y="256" font-size="23" font-weight="760" fill="#163347">API + runtime</text><text x="68" y="283" font-size="13" fill="#5c7380">Executable Python demonstrator</text><circle cx="74" cy="319" r="3.5" fill="#54a58c"/><text x="88" y="324" font-size="14.3" fill="#314e5e">Python 3.11+</text><circle cx="74" cy="353" r="3.5" fill="#54a58c"/><text x="88" y="358" font-size="14.3" fill="#314e5e">FastAPI · Pydantic</text><circle cx="74" cy="387" r="3.5" fill="#54a58c"/><text x="88" y="392" font-size="14.3" fill="#314e5e">Uvicorn HTTP server</text><circle cx="74" cy="421" r="3.5" fill="#54a58c"/><text x="88" y="426" font-size="14.3" fill="#314e5e">ReplaySession state engine</text><circle cx="74" cy="455" r="3.5" fill="#54a58c"/><text x="88" y="460" font-size="14.3" fill="#314e5e">Timestamp and CGM quality checks</text><rect x="350" y="158" width="284" height="350" rx="18" fill="#fff" stroke="#cadae0"/><rect x="350" y="158" width="284" height="8" rx="4" fill="#4c99a6"/><circle cx="386" cy="205" r="21" fill="#20394a"/><text x="386" y="210" font-size="14" fill="#e1f7f1" font-weight="800" text-anchor="middle">02</text><text x="370" y="256" font-size="23" font-weight="760" fill="#163347">Interactive UI</text><text x="370" y="283" font-size="13" fill="#5c7380">Served directly by FastAPI</text><circle cx="376" cy="319" r="3.5" fill="#54a58c"/><text x="390" y="324" font-size="14.3" fill="#314e5e">Semantic HTML</text><circle cx="376" cy="353" r="3.5" fill="#54a58c"/><text x="390" y="358" font-size="14.3" fill="#314e5e">CSS layouts / custom SVG charts</text><circle cx="376" cy="387" r="3.5" fill="#54a58c"/><text x="390" y="392" font-size="14.3" fill="#314e5e">Vanilla JavaScript</text><circle cx="376" cy="421" r="3.5" fill="#54a58c"/><text x="390" y="426" font-size="14.3" fill="#314e5e">Guided synthetic replay</text><circle cx="376" cy="455" r="3.5" fill="#54a58c"/><text x="390" y="460" font-size="14.3" fill="#314e5e">Scenario and evidence views</text><rect x="652" y="158" width="284" height="350" rx="18" fill="#fff" stroke="#cadae0"/><rect x="652" y="158" width="284" height="8" rx="4" fill="#4f9f87"/><circle cx="688" cy="205" r="21" fill="#20394a"/><text x="688" y="210" font-size="14" fill="#e1f7f1" font-weight="800" text-anchor="middle">03</text><text x="672" y="256" font-size="23" font-weight="760" fill="#163347">ML + research</text><text x="672" y="283" font-size="13" fill="#5c7380">Separate, gated training path</text><circle cx="678" cy="319" r="3.5" fill="#54a58c"/><text x="692" y="324" font-size="14.3" fill="#314e5e">pandas · NumPy</text><circle cx="678" cy="353" r="3.5" fill="#54a58c"/><text x="692" y="358" font-size="14.3" fill="#314e5e">scikit-learn</text><circle cx="678" cy="387" r="3.5" fill="#54a58c"/><text x="692" y="392" font-size="14.3" fill="#314e5e">joblib model artifacts</text><circle cx="678" cy="421" r="3.5" fill="#54a58c"/><text x="692" y="426" font-size="14.3" fill="#314e5e">Grouped patient holdouts</text><circle cx="678" cy="455" r="3.5" fill="#54a58c"/><text x="692" y="460" font-size="14.3" fill="#314e5e">Model and calibration gates</text><rect x="954" y="158" width="284" height="350" rx="18" fill="#fff" stroke="#cadae0"/><rect x="954" y="158" width="284" height="8" rx="4" fill="#4c99a6"/><circle cx="990" cy="205" r="21" fill="#20394a"/><text x="990" y="210" font-size="14" fill="#e1f7f1" font-weight="800" text-anchor="middle">04</text><text x="974" y="256" font-size="23" font-weight="760" fill="#163347">Verification</text><text x="974" y="283" font-size="13" fill="#5c7380">Checks and submission evidence</text><circle cx="980" cy="319" r="3.5" fill="#54a58c"/><text x="994" y="324" font-size="14.3" fill="#314e5e">pytest · httpx</text><circle cx="980" cy="353" r="3.5" fill="#54a58c"/><text x="994" y="358" font-size="14.3" fill="#314e5e">Deterministic replay trace</text><circle cx="980" cy="387" r="3.5" fill="#54a58c"/><text x="994" y="392" font-size="14.3" fill="#314e5e">Sensor-gap regression tests</text><circle cx="980" cy="421" r="3.5" fill="#54a58c"/><text x="994" y="426" font-size="14.3" fill="#314e5e">GitHub Actions inventory</text><circle cx="980" cy="455" r="3.5" fill="#54a58c"/><text x="994" y="460" font-size="14.3" fill="#314e5e">PDF / PPTX / diagram artifacts</text><rect x="48" y="534" width="1184" height="92" rx="15" fill="#173246"/><circle cx="85" cy="579" r="18" fill="#3a6571"/><text x="85" y="584" font-size="18" text-anchor="middle" fill="#ffffff">+</text><text x="118" y="567" font-size="18" font-weight="700" fill="#e3f8f1">Additional frontend source (not required to run the judge demo)</text><text x="118" y="593" font-size="15" fill="#b4ced7">Next.js 16 · React 19 · TypeScript 5.9 · frontend/</text><text x="50" y="648" font-size="12" fill="#667f87">Technology names reflect committed dependency manifests and source files, not claims of deployment or clinical certification.</text></g></svg>