<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 604" width="1260" height="604" role="img" aria-labelledby="t d">
<title id="t">Independent CGMacros benchmark — glucose MAE versus persistence baseline</title>
<desc id="d">Separate 45-participant CGMacros benchmark. At 30, 60, 120 minutes persistence mean absolute error is 14.82, 22.94, 32.46 and independent model error is 13.09, 20.77, 27.67 milligrams per deciliter. This is not active demo model performance.</desc>
<rect width="1260" height="604" fill="#f5f8f9"/><rect width="1260" height="7" fill="#398f86"/><g font-family="Inter,Arial,sans-serif">
<text x="54" y="56" font-size="31" font-weight="760" fill="#153347">Independent CGMacros research benchmark</text>
<text x="55" y="89" font-size="16" fill="#567180">45 participants · primary patient-grouped holdout: 10 (only 3 with Type-2 diabetes)</text>
<rect x="239" y="111" width="17" height="17" rx="3" fill="#98aeb8"/><text x="264" y="125" font-size="14" fill="#385365">Persistence baseline MAE</text><rect x="481" y="111" width="17" height="17" rx="3" fill="#408c85"/><text x="507" y="125" font-size="14" fill="#385365">Independent study ML MAE</text><text x="1020" y="125" font-size="14" fill="#567180" font-weight="750">RELATIVE REDUCTION</text>
<g><text x="60" y="203" font-size="19" font-weight="730" fill="#163447">30 MIN</text><rect x="240" y="175" width="279" height="26" rx="4" fill="#98aeb8"/><rect x="240" y="208" width="247" height="26" rx="4" fill="#408c85"/><text x="531" y="194" font-size="17" font-weight="700" fill="#385365">14.82</text><text x="499" y="227" font-size="17" font-weight="700" fill="#246f69">13.09</text><rect x="1013" y="182" width="189" height="53" rx="8" fill="#e4f0ed"/><text x="1107" y="216" text-anchor="middle" font-size="26" font-weight="800" fill="#24685e">11.65%</text><text x="60" y="297" font-size="19" font-weight="730" fill="#163447">60 MIN</text><rect x="240" y="269" width="433" height="26" rx="4" fill="#98aeb8"/><rect x="240" y="302" width="392" height="26" rx="4" fill="#408c85"/><text x="685" y="288" font-size="17" font-weight="700" fill="#385365">22.94</text><text x="644" y="321" font-size="17" font-weight="700" fill="#246f69">20.77</text><rect x="1013" y="276" width="189" height="53" rx="8" fill="#e4f0ed"/><text x="1107" y="310" text-anchor="middle" font-size="26" font-weight="800" fill="#24685e">9.47%</text><text x="60" y="391" font-size="19" font-weight="730" fill="#163447">120 MIN</text><rect x="240" y="363" width="612" height="26" rx="4" fill="#98aeb8"/><rect x="240" y="396" width="522" height="26" rx="4" fill="#408c85"/><text x="864" y="382" font-size="17" font-weight="700" fill="#385365">32.46</text><text x="774" y="415" font-size="17" font-weight="700" fill="#246f69">27.67</text><rect x="1013" y="370" width="189" height="53" rx="8" fill="#e4f0ed"/><text x="1107" y="404" text-anchor="middle" font-size="26" font-weight="800" fill="#24685e">14.76%</text></g>
<text x="242" y="474" font-size="14" fill="#697f8b">Mean absolute error (MAE), mg/dL. Lower is better. Bars share a common scale (0–35).</text>
<rect x="53" y="499" width="1152" height="75" rx="12" fill="#e8eef1" stroke="#c7d6db"/>
<rect x="53" y="499" width="6" height="75" rx="3" fill="#a46d59"/>
<text x="75" y="527" font-size="16" font-weight="730" fill="#344b5c">Interpretation limit</text>
<text x="75" y="552" font-size="14" fill="#4e6776">Separate reported study; not reproduced by the canonical trainer and not the heuristic model serving live demo forecasts.</text>
</g></svg>