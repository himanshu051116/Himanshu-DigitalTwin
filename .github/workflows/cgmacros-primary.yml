name: CGMacros real primary evidence (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cgmacros-canonical-${{ github.ref }}
  cancel-in-progress: false

jobs:
  primary:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: backend
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-lock.txt
      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt
      - name: Retrieve only official CGMacros CSV members (no food photographs)
        run: python scripts/download_real_data.py cgmacros --csv-only
      - name: Audit full 45-participant primary cohort
        run: |
          python scripts/preflight_data.py \
            --cgmacros-dir data/raw/cgmacros/CGMacros_dateshifted365 \
            --out reports/data_preflight.json
      - name: Run locked participant-holdout canonical training
        id: train
        continue-on-error: true
        run: |
          python scripts/train_submission.py \
            --cgmacros-dir data/raw/cgmacros/CGMacros_dateshifted365 \
            --out models/submission \
            --report reports/evidence_manifest.json
      - name: Render research audit
        if: always()
        run: |
          if test -f reports/evidence_manifest.json && test -f reports/submission_gate.json; then
            python scripts/render_evidence_report.py \
              --evidence reports/evidence_manifest.json \
              --gate reports/submission_gate.json \
              --out reports/EVIDENCE_REPORT.md
          fi
      - name: Upload research evidence (NO raw medical CSVs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cgmacros-primary-evidence-${{ github.run_id }}
          path: |
            backend/reports/data_preflight.json
            backend/reports/evidence_manifest.json
            backend/reports/submission_gate.json
            backend/reports/EVIDENCE_REPORT.md
            backend/models/submission/promotion.json
          if-no-files-found: warn
          retention-days: 7
      - name: Upload frozen model artifacts only if independently approved
        if: steps.train.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: cgmacros-approved-models-${{ github.run_id }}
          path: backend/models/submission/*.joblib
          if-no-files-found: error
          retention-days: 7
      - name: Fail the job when canonical evidence gate did not pass
        if: steps.train.outcome != 'success'
        run: |
          echo 'Canonical evidence did not pass. No trained model was promoted.'
          exit 1
