name: Build judge presentation PDF

on:
  workflow_dispatch:
  push:
    paths:
      - "submission/Presentation.html"
      - ".github/workflows/build-presentation.yml"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install renderer and PDF validator
        run: python -m pip install --disable-pip-version-check weasyprint pypdf
      - name: Render presentation and verify slide count
        run: |
          python - <<'PY'
          from pathlib import Path
          from weasyprint import HTML
          from pypdf import PdfReader

          source = Path("submission/Presentation.html")
          target = Path("submission/HimanshuDigitalTwin_Presentation.pdf")
          HTML(filename=str(source), base_url=str(source.parent.resolve())).write_pdf(str(target))
          pages = len(PdfReader(str(target)).pages)
          print(f"Generated PDF: {target}, pages={pages}")
          if pages != 6:
              raise SystemExit("Expected exactly six slide pages")
          PY
      - name: Commit rendered PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add submission/HimanshuDigitalTwin_Presentation.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Publish printable six-slide presentation PDF"
            git push origin HEAD:main
          fi
