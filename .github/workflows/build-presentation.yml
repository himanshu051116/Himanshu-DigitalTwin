name: Build editable judge presentation

on:
  workflow_dispatch:
  push:
    paths:
      - "submission/generate_native_deck.py"
      - "submission/capture_demo.py"
      - ".github/workflows/build-presentation.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install editable presentation builder
        run: |
          python -m pip install python-pptx pymupdf pillow
          sudo apt-get update -qq
          sudo apt-get install -y libreoffice-impress
      - name: Install local demo and browser tooling
        run: |
          python -m pip install --disable-pip-version-check -r backend/requirements.txt playwright
          python -m playwright install --with-deps chromium
      - name: Capture real synthetic browser states
        run: python submission/capture_demo.py
      - name: Generate editable PowerPoint
        run: python submission/generate_native_deck.py
      - name: Convert PowerPoint to PDF
        run: |
          libreoffice -env:UserInstallation=file:///tmp/hdt-slide-export --headless --convert-to pdf --outdir submission submission/HimanshuDigitalTwin_Presentation.pptx
      - name: Verify and render preview
        run: |
          python - <<'PY'
          import fitz
          from pathlib import Path
          from PIL import Image, ImageOps
          from pptx import Presentation
          folder=Path("submission")
          ppt=folder/"HimanshuDigitalTwin_Presentation.pptx"
          pdf=folder/"HimanshuDigitalTwin_Presentation.pdf"
          preview=folder/"Preview_All_Six_Slides.png"
          deck=Presentation(str(ppt))
          assert len(deck.slides)==6, "Expected six slides"
          assert all(len(slide.shapes)>=12 for slide in deck.slides)
          # Editable: the content is native text and vector shapes, not image-only pages.
          assert all(any(s.has_text_frame and s.text.strip() for s in slide.shapes) for slide in deck.slides)
          assert all(not all(s.shape_type==13 for s in slide.shapes) for slide in deck.slides)
          tiles=[]
          with fitz.open(str(pdf)) as d:
              assert d.page_count==6, "Expected six PDF pages"
              for page in d:
                  pix=page.get_pixmap(matrix=fitz.Matrix(1.2,1.2), alpha=False)
                  import io
                  img=Image.open(io.BytesIO(pix.tobytes("png"))).convert("RGB")
                  tiles.append(ImageOps.pad(img,(720,405),method=Image.Resampling.LANCZOS))
          sheet=Image.new("RGB",(2160,810),"#f0f4f4")
          for i,tile in enumerate(tiles):
              sheet.paste(tile, ((i%3)*720,(i//3)*405))
          sheet.save(preview,optimize=True)
          print("Editable six-slide PPTX, six-page PDF and preview passed.")
          PY
      - name: Publish regenerated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add submission/HimanshuDigitalTwin_Presentation.pptx submission/HimanshuDigitalTwin_Presentation.pdf submission/Preview_All_Six_Slides.png submission/Live_Demo_Lunch.png submission/Live_Demo_SensorGap.png
          if ! git diff --cached --quiet; then
            git commit -m "Publish editable six-slide presentation and PDF"
            git push origin HEAD:main
          fi
